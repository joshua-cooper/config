set -g @theme-bg-primary "#0d0c0c"
set -g @theme-bg-highlight "#393836"
set -g @theme-bg-selection "#223249"
set -g @theme-bg-match "#2d4f67"
set -g @theme-fg-primary "#c5c9c5"
set -g @theme-fg-secondary "#7a8382"
set -g @theme-fg-selection "#c5c9c5"
set -g @theme-fg-match "#c5c9c5"
set -g @theme-fg-notification "#98bb6c"
set -g @theme-fg-border "#0d0c0c"
set -g @theme-fg-active-border "#7a8382"

set -ag terminal-features "xterm-256color:RGB"
set -ag terminal-features "alacritty:RGB,alacritty:usstyle"

set -ag update-environment XDG_*
set -ag update-environment XCURSOR_*
set -ag update-environment WAYLAND_DISPLAY
set -ag update-environment NIRI_SOCKET

set -g mouse on
set -g set-titles on
set -g set-clipboard on
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off

set -g status-keys vi
set -g mode-keys vi

set -g base-index 1
set -g pane-base-index 1

set -g escape-time 10
set -g history-limit 1000000

set -g popup-border-lines rounded
set -g menu-border-lines rounded

set -g main-pane-height 70%
set -g main-pane-width 70%

set -g status-position top
set -g status-left " "
set -g status-right "#{?#{!=:#{client_key_table},root},[#{client_key_table}],} "
set -g status-left-length 50
set -g status-right-length 50
set -g status-style "bg=#{@theme-bg-primary} fg=#{@theme-fg-primary}"

set -g window-status-separator " "
set -g window-status-format "#{?window_marked_flag,#[bold],}#{?window_zoomed_flag,#[italics],}#I:#W"
set -g window-status-current-format "#{?window_marked_flag,#[bold],}#{?window_zoomed_flag,#[italics],}#I:#W"
set -g window-status-style "bg=#{@theme-bg-primary} fg=#{@theme-fg-secondary}"
set -g window-status-current-style "bg=#{@theme-bg-primary} fg=#{@theme-fg-primary}"
set -g window-status-bell-style "bg=#{@theme-bg-primary} fg=#{@theme-fg-notification}"
set -g window-status-activity-style "bg=#{@theme-bg-primary} fg=#{@theme-fg-notification}"

set -g mode-style "bg=#{@theme-bg-selection} fg=#{@theme-fg-selection}"
set -g copy-mode-match-style "bg=#{@theme-bg-match} fg=#{@theme-fg-match}"
set -g copy-mode-current-match-style "bg=#{@theme-bg-match} fg=#{@theme-fg-match} bold"
set -g copy-mode-mark-style "bg=#{@theme-bg-highlight} fg=#{@theme-fg-primary}"
set -g message-style "bg=#{@theme-bg-primary}"
set -g message-command-style "bg=#{@theme-bg-primary}"
set -g menu-selected-style "bg=#{@theme-bg-highlight} fg=#{@theme-fg-primary}"

set -g popup-border-style "fg=#{@theme-fg-active-border}"
set -g pane-border-style "fg=#{@theme-fg-border}"
set -g pane-active-border-style "fg=#{@theme-fg-active-border}"

set -g prefix M-space
bind M-space send-prefix
unbind C-b

bind -n M-o if -F "#{==:#{client_termname},tmux-256color}" \
	"detach; run 'tmux-projects open || true'" \
	"run 'tmux-projects open || true'"

bind -n M-0 if -F "#{==:#{client_termname},tmux-256color}" \
	"detach" \
	"popup -E -w 100% -h 70% -y 100% 'tmux new -A -s scratch -c ~ > /dev/null'"

bind -n M-f resize-pane -Z
bind b set -g status

bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind -n M-h if -F "#{pane_at_left}" "" "select-pane -L"
bind -n M-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind -n M-k if -F "#{pane_at_top}" "" "select-pane -U"
bind -n M-l if -F "#{pane_at_right}" "" "select-pane -R"

bind -n M-H if -F "#{pane_at_left}" "" "swap-pane -s '{left-of}'"
bind -n M-J if -F "#{pane_at_bottom}" "" "swap-pane -s '{down-of}'"
bind -n M-K if -F "#{pane_at_top}" "" "swap-pane -s '{up-of}'"
bind -n M-L if -F "#{pane_at_right}" "" "swap-pane -s '{right-of}'"

bind -n M-r switch-client -T resize
bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize j resize-pane -D 1 \; switch-client -T resize
bind -T resize k resize-pane -U 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

bind -n M-n select-window -n
bind -n M-p select-window -p

bind -n M-N run -C "swap-window -d -s #{window_id} -t +1"
bind -n M-P run -C "swap-window -d -s #{window_id} -t -1"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-! if -F "#{!=:#I,1}" "join-pane -t :1"
bind -n M-@ if -F "#{!=:#I,2}" "join-pane -t :2"
bind -n M-# if -F "#{!=:#I,3}" "join-pane -t :3"
bind -n M-$ if -F "#{!=:#I,4}" "join-pane -t :4"
bind -n M-% if -F "#{!=:#I,5}" "join-pane -t :5"
bind -n M-^ if -F "#{!=:#I,6}" "join-pane -t :6"
bind -n M-& if -F "#{!=:#I,7}" "join-pane -t :7"
bind -n M-* if -F "#{!=:#I,8}" "join-pane -t :8"
bind -n M-( if -F "#{!=:#I,9}" "join-pane -t :9"

%hidden CHOOSE_TREE_SESSION_FORMAT="\
#{?session_alerts,#[fg=#{@theme-fg-notification}],}\
#{?session_marked,#[bold],}\
#{session_windows} #{?#{==:#{session_windows},1},window,windows}\
#{?session_grouped, (group #{session_group}: #{session_group_list}),}\
#{?session_attached, (attached),}\
"

%hidden CHOOSE_TREE_WINDOW_FORMAT="\
#{?window_bell_flag,#[fg=#{@theme-fg-notification}],}\
#{?window_activity_flag,#[fg=#{@theme-fg-notification}],}\
#{?window_silence_flag,#[fg=#{@theme-fg-notification}],}\
#{?window_marked_flag,#[bold],}\
#{window_name}\
#{?#{&&:#{==:#{window_panes},1},#{pane_title}}, #[fg=#{@theme-fg-secondary}]#{pane_title}#[default],}\
"

%hidden CHOOSE_TREE_PANE_FORMAT="\
#{?pane_marked,#[bold],}\
#{pane_current_command}\
#{?pane_title, #[fg=#{@theme-fg-secondary}]#{pane_title}#[default],}\
"

%hidden CHOOSE_TREE_FORMAT="\
#{?session_format,$CHOOSE_TREE_SESSION_FORMAT,}\
#{?window_format,$CHOOSE_TREE_WINDOW_FORMAT,}\
#{?pane_format,$CHOOSE_TREE_PANE_FORMAT,}\
"

bind s choose-tree -sZ -O time -F "$CHOOSE_TREE_FORMAT"
bind w choose-tree -wZ -O time -F "$CHOOSE_TREE_FORMAT"
